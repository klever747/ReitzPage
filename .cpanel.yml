---
# Configuración oficial de despliegue automático cPanel Git™ Version Control
# Proyecto: Ventas Reitz
deployment:
  tasks:
    - export DEPLOYPATH=/home/TU_USUARIO_CPANEL/public_html/
    # Copia los archivos del proyecto o el build a public_html
    - /bin/cp -R * $DEPLOYPATH
    # Si existe carpeta dist (generada por Vite), copiar su contenido:
    # - /bin/cp -R dist/* $DEPLOYPATH
    - /bin/chmod -R 755 $DEPLOYPATH
