---
# Configuración oficial de despliegue automático cPanel Git™ Version Control
# Servidor: ventasreitz.com | Usuario: ventasreitz
deployment:
  tasks:
    - export DEPLOYPATH=/home/ventasreitz/public_html/
    - /bin/cp -R dist/* $DEPLOYPATH
    - /bin/cp dist/.htaccess $DEPLOYPATH
    - /bin/chmod -R 755 $DEPLOYPATH
