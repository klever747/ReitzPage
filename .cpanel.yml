---
# Configuración oficial de despliegue automático cPanel Git™ Version Control
# Servidor: ventasreitz.com | Usuario: ventasreitz
deployment:
  tasks:
    - /bin/cp -rf dist/* /home/ventasreitz/public_html/
    - /bin/cp -f dist/.htaccess /home/ventasreitz/public_html/.htaccess
    - /bin/chmod -R 755 /home/ventasreitz/public_html/
