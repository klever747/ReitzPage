<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLounge6" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3d2c18" />
      <stop offset="45%" stop-color="#231a10" />
      <stop offset="85%" stop-color="#120e0a" />
      <stop offset="100%" stop-color="#0a0806" />
    </radialGradient>
    <filter id="softGlow6">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="533" fill="url(#bgLounge6)" />
  <rect x="120" y="40" width="160" height="180" rx="20" fill="#f5c26b" opacity="0.15" filter="url(#softGlow6)" />
  <rect x="140" y="60" width="120" height="4" fill="#ffd88a" opacity="0.4" />
  <rect x="130" y="120" width="140" height="4" fill="#ffd88a" opacity="0.3" />

  <!-- Body (Royal Blue Suit, Arms Crossed) -->
  <g id="body">
    <polygon points="175,200 225,200 215,260 185,260" fill="#ffffff" />
    <polygon points="194,215 206,215 208,310 200,330 192,310" fill="#1d4ed8" />

    <!-- Royal Blue Jacket -->
    <path d="M 120 533 L 128 250 C 135 210 160 195 190 195 C 220 195 245 210 252 250 L 280 533 Z" fill="#2563eb" />
    <polygon points="158,205 195,280 180,330 142,260" fill="#3b82f6" />
    <polygon points="242,205 205,280 220,330 258,260" fill="#1d4ed8" />

    <!-- Arms Crossed across chest -->
    <!-- Left Arm folding across -->
    <path d="M 130 250 L 155 350 L 265 340" stroke="#2563eb" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Arm folding across -->
    <path d="M 270 250 L 245 350 L 135 340" stroke="#1d4ed8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Luxury Steel Watch on folded wrist -->
    <rect x="138" y="325" width="14" height="12" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
    <!-- Hands tucked -->
    <ellipse cx="132" cy="335" rx="10" ry="8" fill="#cfa57c" />
    <ellipse cx="268" cy="335" rx="10" ry="8" fill="#cfa57c" />
  </g>

  <!-- Head & Face -->
  <g id="head">
    <polygon points="185,180 215,180 218,220 182,220" fill="#be9368" />
    <ellipse cx="200" cy="145" rx="36" ry="44" fill="#cfa57c" />
    <path d="M 168 145 C 168 185 180 195 200 195 C 220 195 232 185 232 145 Z" fill="#cfa57c" />

    <!-- Clean Cut Hair -->
    <path d="M 163 140 C 162 102 182 86 200 86 C 223 86 237 102 236 140 C 228 114 210 106 198 106 C 180 106 170 118 163 140 Z" fill="#181512" />

    <!-- Eyes & Brows -->
    <ellipse cx="186" cy="139" rx="3.5" ry="2.5" fill="#2b1a11" />
    <ellipse cx="214" cy="139" rx="3.5" ry="2.5" fill="#2b1a11" />
    <path d="M 179 132 Q 186 129 193 132" stroke="#1d140e" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 207 132 Q 214 129 221 132" stroke="#1d140e" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Nose & Executive Smile -->
    <path d="M 199 137 L 197 154 Q 200 156 203 154" stroke="#b0855c" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 188 165 Q 200 176 212 165" stroke="#8a4f3b" stroke-width="2" fill="#fff" />
  </g>
</svg>
