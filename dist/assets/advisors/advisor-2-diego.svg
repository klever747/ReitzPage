<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLounge2" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3d2c18" />
      <stop offset="45%" stop-color="#231a10" />
      <stop offset="85%" stop-color="#120e0a" />
      <stop offset="100%" stop-color="#0a0806" />
    </radialGradient>
    <filter id="softGlow2">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="533" fill="url(#bgLounge2)" />
  <rect x="120" y="40" width="160" height="180" rx="20" fill="#f5c26b" opacity="0.15" filter="url(#softGlow2)" />
  <rect x="140" y="60" width="120" height="4" fill="#ffd88a" opacity="0.4" />
  <rect x="130" y="120" width="140" height="4" fill="#ffd88a" opacity="0.3" />

  <!-- Body (Charcoal suit, holding blue phone) -->
  <g id="body">
    <polygon points="175,200 225,200 215,260 185,260" fill="#ffffff" />
    <polygon points="194,215 206,215 209,310 200,330 191,310" fill="#2d3139" />

    <!-- Suit Jacket -->
    <path d="M 120 533 L 128 250 C 135 210 160 195 190 195 C 220 195 245 210 252 250 L 280 533 Z" fill="#32353c" />
    <polygon points="158,205 195,280 180,330 142,260" fill="#3c4049" />
    <polygon points="242,205 205,280 220,330 258,260" fill="#282a30" />

    <!-- Left Arm holding blue phone -->
    <path d="M 130 250 L 155 360 L 205 330" stroke="#32353c" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Arm in pocket -->
    <path d="M 270 250 L 295 380 L 275 430" stroke="#32353c" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Hand & Blue Smartphone -->
    <ellipse cx="205" cy="330" rx="14" ry="12" fill="#cfa57c" />
    <!-- Smartphone -->
    <g transform="translate(195, 305) rotate(-15)">
      <rect x="0" y="0" width="24" height="46" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="2" y="2" width="20" height="42" rx="3" fill="#0369a1" />
      <circle cx="12" cy="7" r="2" fill="#0c4a6e" />
    </g>
  </g>

  <!-- Head & Face -->
  <g id="head">
    <polygon points="185,180 215,180 218,220 182,220" fill="#be9368" />
    <ellipse cx="200" cy="145" rx="36" ry="44" fill="#cfa57c" />
    <path d="M 168 145 C 168 185 180 195 200 195 C 220 195 232 185 232 145 Z" fill="#cfa57c" />

    <!-- Short neat hair -->
    <path d="M 163 140 C 162 105 180 90 200 90 C 225 90 238 105 237 140 C 230 115 210 108 198 108 C 180 108 170 120 163 140 Z" fill="#201b17" />

    <!-- Eyes & Brows -->
    <ellipse cx="186" cy="140" rx="3.5" ry="2.5" fill="#2b1a11" />
    <ellipse cx="214" cy="140" rx="3.5" ry="2.5" fill="#2b1a11" />
    <path d="M 179 133 Q 186 130 193 133" stroke="#1d140e" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 207 133 Q 214 130 221 133" stroke="#1d140e" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Nose & Smile -->
    <path d="M 199 138 L 197 155 Q 200 157 203 155" stroke="#b0855c" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 188 166 Q 200 176 212 166" stroke="#8a4f3b" stroke-width="2" fill="#fff" />
  </g>
</svg>
