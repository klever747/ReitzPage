<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="100%" height="100%">
  <defs>
    <!-- Warm luxury ambient background -->
    <radialGradient id="bgLounge1" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3d2c18" />
      <stop offset="45%" stop-color="#231a10" />
      <stop offset="85%" stop-color="#120e0a" />
      <stop offset="100%" stop-color="#0a0806" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeec1" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a7418" />
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdf88" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffdf88" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="533" fill="url(#bgLounge1)" />
  <!-- Interior lighting bokeh -->
  <rect x="120" y="40" width="160" height="180" rx="20" fill="#f5c26b" opacity="0.15" filter="url(#softGlow)" />
  <rect x="140" y="60" width="120" height="4" fill="#ffd88a" opacity="0.4" />
  <rect x="130" y="120" width="140" height="4" fill="#ffd88a" opacity="0.3" />

  <!-- Person Body (Erick / Black Suit holding folder) -->
  <g id="body">
    <!-- White shirt -->
    <polygon points="175,200 225,200 215,260 185,260" fill="#f8f9fa" />
    <!-- Black Tie -->
    <polygon points="194,215 206,215 210,310 200,330 190,310" fill="#151515" />
    <polygon points="193,212 207,212 204,228 196,228" fill="#222" />

    <!-- Black Suit Jacket -->
    <path d="M 120 533 L 130 250 C 135 210 160 195 190 195 C 220 195 245 210 250 250 L 280 533 Z" fill="#1b1c20" />
    <!-- Left Lapel -->
    <polygon points="160,205 195,280 180,330 145,260" fill="#25262c" />
    <!-- Right Lapel -->
    <polygon points="240,205 205,280 220,330 255,260" fill="#202126" />

    <!-- Arms -->
    <!-- Left Arm holding folder -->
    <path d="M 130 250 L 105 380 L 175 350 L 180 320" stroke="#1b1c20" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Arm holding folder on right -->
    <path d="M 265 250 L 290 350 L 320 380" stroke="#1b1c20" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Black Folder with Gold R Logo -->
    <g transform="translate(230, 240) rotate(6)">
      <rect x="0" y="0" width="115" height="155" rx="4" fill="#0d0e12" stroke="#2a2c33" stroke-width="1.5" />
      <polygon points="0,0 45,0 0,60" fill="#181920" />
      <!-- Gold corner accent -->
      <polygon points="0,155 35,155 0,120" fill="url(#goldGrad)" opacity="0.9" />
      <!-- Golden R Logo on Folder -->
      <g transform="translate(28, 25) scale(0.28)">
        <path d="M 80 360 L 80 176 L 225 76 L 225 360 L 80 360 Z" stroke="url(#goldGrad)" stroke-width="8" fill="none" />
        <path d="M 98 186 L 144 186 L 138 194 L 126 194 L 126 312 L 138 312 L 144 320 L 98 320 L 104 312 L 116 312 L 116 194 L 104 194 Z" fill="url(#goldGrad)" />
        <path d="M 124 186 C 172 186 204 196 204 226 C 204 256 168 266 124 266 L 124 254 C 160 254 189 248 189 226 C 189 204 156 198 124 198 Z" fill="url(#goldGrad)" />
        <path d="M 148 252 C 164 252 178 265 190 286 C 203 309 218 333 246 339 C 238 340 220 340 208 326 C 196 312 185 292 174 274 C 166 262 158 257 148 254 Z" fill="url(#goldGrad)" />
        <text x="215" y="350" text-anchor="end" fill="url(#goldGrad)" font-family="serif" font-size="12" font-weight="600">By Cofiza</text>
      </g>
    </g>

    <!-- Hands -->
    <!-- Hand pointing (Left) -->
    <ellipse cx="178" cy="330" rx="14" ry="12" fill="#cfa57c" />
    <path d="M 175 325 L 225 332" stroke="#cfa57c" stroke-width="9" stroke-linecap="round" />
    <!-- Silver Watch -->
    <rect x="156" y="322" width="10" height="14" rx="2" fill="#c0c5ce" stroke="#7e8590" stroke-width="1" />
    <!-- Hand holding folder (Right) -->
    <ellipse cx="320" cy="325" rx="14" ry="16" fill="#cfa57c" />
  </g>

  <!-- Head & Face -->
  <g id="head">
    <!-- Neck -->
    <polygon points="185,180 215,180 218,220 182,220" fill="#be9368" />
    <!-- Head Base -->
    <ellipse cx="200" cy="145" rx="36" ry="44" fill="#cfa57c" />
    <!-- Cheeks & Chin contour -->
    <path d="M 168 145 C 168 185 180 195 200 195 C 220 195 232 185 232 145 Z" fill="#cfa57c" />

    <!-- Dark Hair -->
    <path d="M 162 140 C 160 100 185 85 202 85 C 225 85 240 100 238 140 C 230 115 210 105 195 105 C 180 105 170 120 162 140 Z" fill="#181513" />
    <path d="M 160 135 C 165 95 195 82 225 88 C 240 95 242 115 240 140 C 235 125 220 115 200 115 C 180 115 168 125 160 135 Z" fill="#26201a" />

    <!-- Eyes & Brows -->
    <ellipse cx="186" cy="140" rx="3.5" ry="2.5" fill="#2b1a11" />
    <ellipse cx="214" cy="140" rx="3.5" ry="2.5" fill="#2b1a11" />
    <path d="M 179 133 Q 186 130 193 133" stroke="#1d140e" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 207 133 Q 214 130 221 133" stroke="#1d140e" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 199 138 L 197 155 Q 200 157 203 155" stroke="#b0855c" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Smile / Teeth -->
    <path d="M 188 166 Q 200 178 212 166" stroke="#8a4f3b" stroke-width="2" fill="#fff" />
  </g>
</svg>
