<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLounge5" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3d2c18" />
      <stop offset="45%" stop-color="#231a10" />
      <stop offset="85%" stop-color="#120e0a" />
      <stop offset="100%" stop-color="#0a0806" />
    </radialGradient>
    <filter id="softGlow5">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="533" fill="url(#bgLounge5)" />
  <rect x="120" y="40" width="160" height="180" rx="20" fill="#f5c26b" opacity="0.15" filter="url(#softGlow5)" />
  <rect x="140" y="60" width="120" height="4" fill="#ffd88a" opacity="0.4" />
  <rect x="130" y="120" width="140" height="4" fill="#ffd88a" opacity="0.3" />

  <!-- Body (Light medium gray suit, fist pump gesture) -->
  <g id="body">
    <polygon points="175,200 225,200 215,260 185,260" fill="#ffffff" />
    <polygon points="194,215 206,215 208,310 200,330 192,310" fill="#374151" />

    <!-- Medium Gray Jacket -->
    <path d="M 120 533 L 128 250 C 135 210 160 195 190 195 C 220 195 245 210 252 250 L 280 533 Z" fill="#888e99" />
    <polygon points="158,205 195,280 180,330 142,260" fill="#9da3af" />
    <polygon points="242,205 205,280 220,330 258,260" fill="#757b85" />

    <!-- Left Arm raised in fist pump -->
    <path d="M 130 250 L 120 330 L 140 260" stroke="#888e99" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Fist -->
    <ellipse cx="140" cy="245" rx="15" ry="14" fill="#cfa57c" />
    <path d="M 130 240 Q 140 232 150 240" stroke="#b0855c" stroke-width="2" fill="none" />

    <!-- Right Arm hanging naturally -->
    <path d="M 270 250 L 295 380 L 290 480" stroke="#888e99" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Head & Face -->
  <g id="head">
    <polygon points="185,180 215,180 218,220 182,220" fill="#be9368" />
    <ellipse cx="200" cy="145" rx="36" ry="44" fill="#cfa57c" />
    <path d="M 168 145 C 168 185 180 195 200 195 C 220 195 232 185 232 145 Z" fill="#cfa57c" />

    <!-- Short high fade hair -->
    <path d="M 164 140 C 163 100 182 86 200 86 C 223 86 237 100 236 140 C 228 112 210 105 198 105 C 180 105 170 118 164 140 Z" fill="#1a1512" />

    <!-- Eyes & Brows -->
    <ellipse cx="186" cy="140" rx="3.5" ry="2.5" fill="#2b1a11" />
    <ellipse cx="214" cy="140" rx="3.5" ry="2.5" fill="#2b1a11" />
    <path d="M 179 133 Q 186 130 193 133" stroke="#1d140e" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 207 133 Q 214 130 221 133" stroke="#1d140e" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Nose & Big Smile -->
    <path d="M 199 138 L 197 155 Q 200 157 203 155" stroke="#b0855c" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 186 165 Q 200 178 214 165" stroke="#8a4f3b" stroke-width="2.5" fill="#fff" />
  </g>
</svg>
