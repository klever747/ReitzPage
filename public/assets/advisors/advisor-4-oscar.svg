<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLounge4" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#3d2c18" />
      <stop offset="45%" stop-color="#231a10" />
      <stop offset="85%" stop-color="#120e0a" />
      <stop offset="100%" stop-color="#0a0806" />
    </radialGradient>
    <filter id="softGlow4">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="533" fill="url(#bgLounge4)" />
  <rect x="120" y="40" width="160" height="180" rx="20" fill="#f5c26b" opacity="0.15" filter="url(#softGlow4)" />
  <rect x="140" y="60" width="120" height="4" fill="#ffd88a" opacity="0.4" />
  <rect x="130" y="120" width="140" height="4" fill="#ffd88a" opacity="0.3" />

  <!-- Body (Dark Teal / Petrol suit, thumbs up) -->
  <g id="body">
    <polygon points="175,200 225,200 215,260 185,260" fill="#ffffff" />
    <polygon points="194,215 206,215 208,310 200,330 192,310" fill="#0f4c5c" />

    <!-- Dark Teal Jacket -->
    <path d="M 120 533 L 128 250 C 135 210 160 195 190 195 C 220 195 245 210 252 250 L 280 533 Z" fill="#155d74" />
    <polygon points="158,205 195,280 180,330 142,260" fill="#1c708c" />
    <polygon points="242,205 205,280 220,330 258,260" fill="#114b5e" />

    <!-- Left Arm with thumbs up -->
    <path d="M 130 250 L 140 370 L 175 365" stroke="#155d74" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Right Arm resting -->
    <path d="M 270 250 L 295 380 L 275 430" stroke="#155d74" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Hand with Thumbs Up (Left foreground) -->
    <g transform="translate(170, 325)">
      <ellipse cx="10" cy="30" rx="14" ry="12" fill="#cfa57c" />
      <!-- Thumb pointing up -->
      <path d="M 16 28 L 18 8 C 18 3 10 3 10 8 L 8 28 Z" fill="#cfa57c" stroke="#b0855c" stroke-width="1.5" />
    </g>
  </g>

  <!-- Head & Face with Glasses & Goatee -->
  <g id="head">
    <polygon points="185,180 215,180 218,220 182,220" fill="#be9368" />
    <ellipse cx="200" cy="145" rx="36" ry="44" fill="#cfa57c" />
    <path d="M 168 145 C 168 185 180 195 200 195 C 220 195 232 185 232 145 Z" fill="#cfa57c" />

    <!-- Dark Hair with slight wave -->
    <path d="M 163 140 C 160 98 182 84 200 84 C 224 84 238 98 237 140 C 228 110 210 102 198 102 C 180 102 170 115 163 140 Z" fill="#1b1613" />

    <!-- Stylish Transparent Glasses -->
    <rect x="172" y="128" width="24" height="18" rx="4" fill="rgba(255,255,255,0.2)" stroke="#e2e8f0" stroke-width="2" />
    <rect x="204" y="128" width="24" height="18" rx="4" fill="rgba(255,255,255,0.2)" stroke="#e2e8f0" stroke-width="2" />
    <line x1="196" y1="135" x2="204" y2="135" stroke="#e2e8f0" stroke-width="2" />

    <!-- Eyes inside glasses -->
    <ellipse cx="184" cy="137" rx="3.5" ry="2.5" fill="#2b1a11" />
    <ellipse cx="216" cy="137" rx="3.5" ry="2.5" fill="#2b1a11" />

    <!-- Goatee and Mustache -->
    <path d="M 188 158 Q 200 156 212 158 Q 200 162 188 158 Z" fill="#201b17" />
    <path d="M 194 176 Q 200 186 206 176 Q 200 182 194 176 Z" fill="#201b17" />

    <!-- Nose & Smile with teeth -->
    <path d="M 199 136 L 197 152 Q 200 154 203 152" stroke="#b0855c" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 187 163 Q 200 175 213 163" stroke="#8a4f3b" stroke-width="2.5" fill="#fff" />
  </g>
</svg>
